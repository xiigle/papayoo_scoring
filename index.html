<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14111c"><title>Papayoo – Scores</title>
<style>
:root{--bg:#14111c;--card:#241f33;--mu:#a99fc4;--o:#ff9a1f;--g:#4cc13f;--r:#e8283c;--k:#ff3fa4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#14111c repeating-conic-gradient(from 0deg at 50% -10%,#1d1930 0 7deg,#14111c 7deg 14deg) fixed;color:#fff;font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#w{max-width:520px;margin:auto;padding:10px 12px 30px}
header{text-align:center;position:relative;padding:6px 0 10px}
.logo span{display:inline-block;font:900 40px Impact,"Arial Black",sans-serif;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.card{background:var(--card);border:2px solid #3a3352;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 6px 0 #0b0911}
h2{margin:0 0 10px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--o)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #000}
input{background:#14111c;border:2px solid #3a3352;border-radius:12px;color:#fff;font:inherit;padding:10px 12px;min-width:0}
input:focus{outline:none;border-color:var(--o)}
.row input{flex:1}.row input[type=number]{flex:none;width:90px;text-align:center;font-size:20px;font-weight:800}
button{font:inherit;font-weight:800;border:2px solid #000;border-radius:14px;padding:12px 16px;color:#fff;cursor:pointer}
button:active{transform:translateY(2px)}
.main{background:linear-gradient(#ff5a3c,#e8283c);width:100%;box-shadow:0 4px 0 #000;font-size:18px;margin-top:8px}
.ghost{background:#352e4d;flex:1}
.ic{background:#352e4d;padding:8px 14px;flex:none}
.big{font-size:28px;min-width:40px;text-align:center}
small{color:var(--mu)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;margin:6px 0;background:#1a1628;border-left:8px solid}
.rk .n{width:28px;font-size:20px;text-align:center}.rk b{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .t{font-size:24px;font-weight:900}
.rk.w{background:#3a2f12;box-shadow:0 0 0 2px #ffd91a}
.info{display:flex;justify-content:space-between;align-items:center;gap:8px}
.suit{font-size:34px;font-weight:900;text-shadow:0 2px 0 #000}
.sc{overflow-x:auto;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid #342d4a}
th{color:var(--mu);font-size:12px}th[data-r]{cursor:pointer;text-decoration:underline}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
td.t{font-weight:900;color:var(--o);font-size:17px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--card);width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;border-top:3px solid var(--o)}

.ok{color:var(--g)}.bad{color:var(--r)}
.top{position:absolute;right:0;top:8px;background:#352e4d;padding:8px 12px;font-size:13px}
.ban{text-align:center;font-size:20px;font-weight:900;color:#ffd91a}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{display:inline-flex;background:#352e4d;border:2px solid #000;border-radius:20px;overflow:hidden;font-weight:700}
.chip b{padding:8px 4px 8px 14px}.chip i{font-style:normal;padding:8px 12px 8px 8px;color:var(--mu)}
.row input[type=number]{width:72px}.row .ic{padding:8px 10px}
.modal.c{align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--card);border:3px solid var(--o);border-radius:22px;padding:20px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 0 #0b0911;max-height:94%;overflow:auto}
.dlg .em{font-size:44px}.dlg h3{margin:4px 0 6px;font-size:20px}.dlg p{color:var(--mu);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}
.cd{background:#000;border:2px solid #fff4;border-radius:10px;padding:11px 0;font-size:19px;font-weight:900;color:#fff}
.cd.pp{grid-column:1/-1;display:flex;justify-content:center;gap:10px;align-items:baseline;border-color:#000;text-shadow:0 2px 0 #000}
.pp small{color:#fff}.cd.on{outline:3px solid #fff;background:var(--k)}
[data-a],.cd,.chip b,.chip i{cursor:pointer}
input[readonly]{border-color:#5b4f80;cursor:pointer;caret-color:transparent}
.kd{font-size:46px;font-weight:900;background:#14111c;border:2px solid #3a3352;border-radius:14px;padding:6px;margin:10px 0;color:#ffd91a}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kb{background:#352e4d;font-size:26px;padding:14px 0;box-shadow:0 4px 0 #000}.kb.op{background:#5a2a45}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input:not([readonly]){-webkit-user-select:text;user-select:text}
input[readonly]{-webkit-user-select:none;user-select:none}
input[readonly]::selection{background:transparent}
.rules{background:#1a1628;border-radius:14px;padding:12px;margin:12px 0 4px}.rules h2{font-size:13px;margin:0 0 8px}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.rg b{display:block;font-size:28px;color:#ffd91a;line-height:1.1}.rg small{font-size:11px}
.rn{margin-top:8px;font-size:13px;color:var(--o);text-align:center}
.card>.rules{margin:0}
.die{width:130px;height:130px;margin:18px auto 12px;background:#fff;border:4px solid #000;border-radius:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 #000}
.die span{font-size:78px;font-weight:900;line-height:1;text-shadow:0 3px 0 #000}
.die.roll{animation:tumble .5s linear infinite}.die.land{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes tumble{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(90deg) translateY(-28px) scale(1.1)}50%{transform:rotate(180deg) translateY(0) scale(1)}75%{transform:rotate(270deg) translateY(-28px) scale(1.1)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
@keyframes pop{0%{transform:scale(.5) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
.lg2{right:auto;left:0}
.lgl{display:grid;gap:8px;margin:14px 0}.lo{background:#352e4d;display:flex;align-items:center;gap:12px;font-size:18px;text-align:left;box-shadow:0 4px 0 #000}.lo span{font-size:26px}.lo.on{background:linear-gradient(#ff5a3c,#e8283c)}
html{scrollbar-gutter:stable}html.lock,html.lock body{overflow:hidden}
.modal{overscroll-behavior:contain;touch-action:none}.sheet,.dlg{touch-action:pan-y}

const ins=()=>[...document.querySelectorAll('#md [data-s]')];
const isGC=v=>v.length>2&&v.filter(x=>x==0).length==1&&v.filter(x=>x==250).length==v.length-1;
function upd(){const v=ins().map(e=>+e.value||0),s=v.reduce((a,b)=>a+b,0),e=$('#sum'),g=isGC(v);e.className=s==250||g?'ok':'bad';e.textContent=g?t('👑 Grand chelem : total {0} ✓',s):t('Total : {0} / 250',s)+(s==250?' ✓':' '+t('(reste {0})',250-s))}
const cs=()=>[...document.querySelectorAll('#ct .cd.on')].reduce((a,c)=>a+ +c.dataset.v,0),
chipsIn=()=>{const l=S.saved.filter(n=>!S.players.some(p=>p.trim().toLowerCase()==n.toLowerCase()));return l.length?`<small>${t('Joueurs enregistrés — touchez pour ajouter')}</small><div class=chips>${l.map(n=>`<span class=chip><b data-a=pick data-nm="${esc(n)}">${esc(n)}</b><i data-a=forget data-nm="${esc(n)}">✕</i></span>`).join('')}</div>`:''};
function ask(ic,t,m,ok,cb){const d=document.createElement('div');d.className='modal c';d.id='cf';
d.innerHTML=`<div class=dlg><div class=em>${ic}</div><h3>${t}</h3><p>${m}</p><div class=row><button class=ghost data-x=n>${t('Annuler')}</button><button class=main style="flex:1;margin:0" data-x=y>${ok}</button></div></div>`;
d.querySelector('[data-x=n]').onclick=()=>d.remove();d.querySelector('[data-x=y]').onclick=()=>{d.remove();cb()};document.body.append(d)}
const TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
function keypad(i){const x=ins()[i];let b=String(+x.value||0),f=true;const m=document.createElement('div');m.className='modal c';m.id='kp';
m.innerHTML=`<div class=dlg><h3>${esc(nm(i))}</h3><div id=kd class=kd>${b}</div><div class=kg>${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button class="kb${k=='C'||k=='⌫'?' op':''}" data-q="${k}">${k}</button>`).join('')}</div><div class=row><button class=ghost data-x=n>${t('Annuler')}</button><button class=main style="flex:1;margin:0" data-x=y>${t('Valider')}</button></div></div>`;
m.onclick=e=>{const q=e.target.closest('[data-q]');if(!q)return;const k=q.dataset.q;
if(k=='C')b='0';else if(k=='⌫')b=b.length>1?b.slice(0,-1):'0';else{const n=f||b=='0'?k:b+k;if(+n<=250)b=n}
f=false;m.querySelector('#kd').textContent=b};
m.querySelector('[data-x=n]').onclick=()=>m.remove();
m.querySelector('[data-x=y]').onclick=()=>{x.value=+b;m.remove();upd();chelem(i)};document.body.append(m)}
function chelem(i){const x=ins();if(+x[i].value!=250)return;
ask('👑',t('Grand chelem ?'),t('{0} a marqué les 250 points. Mettre 0 à {0} et 250 à tous les autres joueurs ?',esc(nm(i))),t('Appliquer'),()=>{x.forEach((e,k)=>e.value=k==i?0:250);upd()})}
const A={
lang(){const m=document.createElement('div');m.className='modal c';m.id='lm';
m.innerHTML=`<div class=dlg><h3>🌐 ${t('Langue')}</h3><div class=lgl>${LG.map(([c,f,n])=>`<button class="lo${c==S.lang?' on':''}" data-l=${c}><span>${f}</span>${n}</button>`).join('')}</div><button class=ghost style="width:100%" data-x=n>${t('Annuler')}</button></div>`;
m.onclick=e=>{const b=e.target.closest('[data-l]');if(b){S.lang=b.dataset.l;m.remove();render()}else if(e.target==m||e.target.closest('[data-x=n]'))m.remove()};document.body.append(m)},
add(){S.players.push('');render()},del(e){S.players.splice(+e.dataset.i,1);render()},
rm(){S.rounds=Math.max(1,S.rounds-1);render()},rp(){S.rounds=Math.min(20,S.rounds+1);render()},
start(){S.players=S.players.map(p=>p.trim());S.players.forEach(p=>{if(p&&!S.saved.some(x=>x.toLowerCase()==p.toLowerCase()))S.saved.push(p)});S.started=true;S.scores=[];S.dice=[];render()},more(){S.rounds++;render()},
dice(){const res=Math.floor(Math.random()*8)%4,m=document.createElement('div');m.className='modal c';m.id='dz';
m.innerHTML=`<div class=dlg><h3>🎲 Papayoo</h3><div id=die class="die roll"><span id=ds>🎲</span></div><div id=dt class=ban>&nbsp;</div><button class=main id=dok style="visibility:hidden;margin-top:14px">OK</button></div>`;
document.body.append(m);const ds=m.querySelector('#ds'),die=m.querySelector('#die');let w=60;
const step=()=>{if(w<400){const x=SU[Math.random()*4|0];ds.textContent=x[0];ds.style.color=x[1];w*=1.13;setTimeout(step,w)}else{const x=SU[res];
ds.textContent=x[0];ds.style.color=x[1];die.className='die land';die.style.boxShadow=`0 0 44px ${x[1]},0 8px 0 #000`;
m.querySelector('#dt').innerHTML=t('Le 7{0} est le Papayoo !',x[0]);S.dice[S.scores.length]=res;save();navigator.vibrate?.(40);
const b=m.querySelector('#dok');b.style.visibility='visible';b.onclick=()=>{m.remove();render()}}};step()},
edit(e){modal(+e.dataset.r)},close(){$('#md')?.remove()},
comp(e){const x=ins(),i=+e.dataset.i;x[i].value=Math.max(0,250-x.reduce((a,el,k)=>a+(k==i?0:+el.value||0),0));upd();chelem(i)},
pick(e){let i=S.players.findIndex(p=>!p.trim());if(i<0&&S.players.length<8){S.players.push('');i=S.players.length-1}if(i>=0)S.players[i]=e.dataset.nm;render()},
forget(e){S.saved=S.saved.filter(x=>x!=e.dataset.nm);render()},
cnt(e){const i=+e.dataset.i,dv=S.dice[+$('#md').dataset.r],m=document.createElement('div');m.className='modal c';m.id='ct';m.dataset.i=i;
const pp=dv!=null?`<button class="cd pp" style="background:${SU[dv][1]}" data-v=40><b>7${SU[dv][0]}</b><small>Papayoo 40</small></button>`:`<button class="cd pp" style="background:#ff9a1f" data-v=40><b>Papayoo</b><small>40 pts</small></button>`;
m.innerHTML=`<div class=dlg><h3>🧮 ${esc(nm(i))}</h3><small>${t('Touchez les cartes de points ramassées')}</small><div class=grid>${pp}${[...Array(20)].map((_,k)=>`<button class=cd data-v=${k+1}>${k+1}</button>`).join('')}</div><div id=ctt class=ban>0 pt</div><div class=row><button class=ghost data-a=cno>${t('Annuler')}</button><button class=main style="flex:1;margin:0" data-a=cok>${t('Valider')}</button></div></div>`;document.body.append(m)},
cno(){$('#ct').remove()},
cok(){const t=cs(),i=+$('#ct').dataset.i;ins()[i].value=t;$('#ct').remove();upd();chelem(i)},
ok(){const r=+$('#md').dataset.r,v=ins().map(e=>Math.max(0,Math.round(+e.value||0))),s=v.reduce((a,b)=>a+b,0);
const go=()=>{S.scores[r]=v;A.close();render()};if(s!=250&&!isGC(v))ask('⚠️',t('Total incorrect'),t('Le total est de {0} au lieu de 250.',s),t('Valider quand même'),go);else go()},
new(){ask('🎴',t('Nouvelle partie ?'),t('La partie en cours sera effacée. Vos joueurs restent enregistrés.'),t('Nouvelle partie'),()=>{S.started=false;S.scores=[];S.dice=[];render()})}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.n!==undefined){S.players[+t.dataset.n]=t.value;save();const c=$('#ch');if(c)c.innerHTML=chipsIn()}if(t.dataset.s!==undefined){upd();if(t.value!==''&&+t.value==250)chelem(+t.dataset.s)}});
document.addEventListener('click',e=>{const c=e.target.closest('.cd');if(c){c.classList.toggle('on');const t=cs();$('#ctt').textContent=t+' pt'+(t>1?'s':'')}});
document.addEventListener('click',e=>{const k=e.target.closest('[data-k]');if(k)keypad(+k.dataset.s)});
document.addEventListener('focusin',e=>{if(e.target.dataset.s!==undefined){if(e.target.readOnly)e.target.blur();else e.target.select()}});
new MutationObserver(()=>document.documentElement.classList.toggle('lock',!!document.querySelector('.modal'))).observe(document.body,{childList:true});
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input:not([readonly])'))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!e.target.closest?.('input:not([readonly])'))e.preventDefault()});
render();
</script></body></html>
